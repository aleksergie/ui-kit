<uik-tree-list [nodeTemplate]="checkboxTemplate" [nodes]="checkboxesData()" [uikTreeController]="true" />

<ng-template #checkboxTemplate let-expanded="expanded" let-hasChildren="hasChildren" let-level="level" let-node
  let-toggle="toggle">
  <div class="tree-node" [style.padding-left.px]="level * 20">
    @if (hasChildren) {
    <button class="tree-node__toggle" type="button" [attr.aria-label]="expanded ? 'Collapse' : 'Expand'"
      (click)="toggle()">
      {{ expanded ? '▼' : '▶' }}
    </button>
    } @else {
    <span aria-hidden="true" class="tree-node__toggle tree-node__toggle--placeholder"></span>
    }

    <input type="checkbox" uikCheckbox [id]="'checkbox-' + node.id" [ngModel]="checkboxState.getState(node)"
      (ngModelChange)="checkboxState.toggle(node, $event)" />
    <label [for]="'checkbox-' + node.id">{{ node.name }}</label>
  </div>
</ng-template>
