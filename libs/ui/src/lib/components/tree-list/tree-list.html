<ul>
  @for (node of nodes(); track trackBy()($index, node)) {
  @let children = childrenOf(node);
  <li>
    <uik-tree-item #item [node]="node" [nodeTemplate]="nodeTemplate()" [level]="level()"
      [children]="children"></uik-tree-item>

    @if (item.hasChildren() && item.isExpanded()) {
    <uik-tree-list [nodes]="children" [nodeTemplate]="nodeTemplate()" [childrenAccessor]="childrenAccessor()"
      [level]="level() + 1" [trackBy]="trackBy()"></uik-tree-list>
    }
  </li>
  }
</ul>
